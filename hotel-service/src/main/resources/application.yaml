server:
  port: 8081

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_hotel
    username: booking_user
    password: booking_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    table: flyway_schema_history_hotel

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-me-please-1234567890-abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
